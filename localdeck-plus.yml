# ---------------------------------------------------------------------------
# One binary sensor per physical key. Buttons are numbered by physical
# position (Button 01 = R1C1 ... Button 24 = R4C6). Because the rows are
# wired upside down, the matrix key letters are S..X for row 1, M..R for
# row 2, G..L for row 3 and A..F for row 4. Each sensor detects four press
# patterns via on_multi_click and fires the matching event on its template
# event entity (event_01 ... event_24). The 20ms debounce filter is
# recommended for on_multi_click with mechanical switches.
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: matrix_keypad
    keypad_id: keypad
    key: S
    name: "Button 01 R1C1"
    id: key_01
    disabled_by_default: true
    internal: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing: ["ON for at most 0.5s", "OFF for at least 0.2s"]
        then:
          - event.trigger: {id: event_01, event_type: single}
      - timing: ["ON for at most 0.5s", "OFF for at most 0.5s", "ON for at most 0.5s", "OFF for at least 0.2s"]
        then:
          - event.trigger: {id: event_01, event_type: double}
      - timing: ["ON for at most 0.5s", "OFF for at most 0.5s", "ON for at most 0.5s", "OFF for at most 0.5s", "ON for at most 0.5s", "OFF for at least 0.2s"]
        then:
          - event.trigger: {id: event_01, event_type: triple}
      - timing: ["ON for at least 1s"]
        then:
          - event.trigger: {id: event_01, event_type: long}
  - platform: matrix_keypad
    keypad_id: keypad
    key: T
    name: "Button 02 R1C2"
    id: key_02
    disabled_by_default: true
    internal: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing: ["ON for at most 0.5s", "OFF for at least 0.2s"]
        then:
          - event.trigger: {id: event_02, event_type: single}
      - timing: ["ON for at most 0.5s", "OFF for at most 0.5s", "ON for at most 0.5s", "OFF for at least 0.2s"]
        then:
          - event.trigger: {id: event_02, event_type: double}
      - timing: ["ON for at most 0.5s", "OFF for at most 0.5s", "ON for at most 0.5s", "OFF for at most 0.5s", "ON for at most 0.5s", "OFF for at least 0.2s"]
        then:
          - event.trigger: {id: event_02, event_type: triple}
      - timing: ["ON for at least 1s"]
        then:
          - event.trigger: {id: event_02, event_type: long}
  - platform: matrix_keypad
    keypad_id: keypad
    key: U
    name: "Button 03 R1C3"
    id: key_03
    disabled_by_default: true
    internal: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
