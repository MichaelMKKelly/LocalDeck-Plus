esphome:
  name: localdeck
  friendly_name: LocalDeck
  min_version: 2026.8.2
  project:
    name: MichaelMKKelly.LocalDeckPlus
    version: 1.0.0
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - light.turn_on:
        id: ledstrip
        brightness: 50%
        effect: Addressable Rainbow
    - delay: 5s
    - light.turn_off:
        id: ledstrip

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

dashboard_import:
  package_import_url: github://MichaelMKKelly/LocalDeck-Plus/localdeck-plus.yml@main

api:
  actions:
    - action: firmwarereinstall
      then:
        - update.perform: 
            id: firmwareupdate
            force_update: true
    - action: stockfirmwareinstall
      then:
        - update.perform: 
            id: stockfirmware
            force_update: true

ota:
  - platform: esphome
  - platform: http_request

http_request:
  buffer_size_rx: 1024
  buffer_size_tx: 1024

update:
  - platform: http_request
    name: "LocalDeck-Plus"
    id: firmwareupdate
    source: https://michaelmkkelly.github.io/LocalDeck-Plus/esphome-updates/update-manifest.json
  - platform: http_request
    name: "LocalDeck-Stock-Firmware"
    id: stockfirmware
    source: https://michaelmkkelly.github.io/LocalDeck-Plus/esphome-updates/stock-manifest.json
    internal: true

wifi:
  ap:

network:
  enable_ipv6: true

esp32_improv:
  authorizer: none

improv_serial:  

time:
  - platform: homeassistant
    id: homeassistant_time

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

button:
  - platform: restart
    name: "Restart"
    id: Restart
    entity_category: config
    disabled_by_default: true
  - platform: factory_reset
    name: "Factory Reset"
    id: Reset
    entity_category: config
    disabled_by_default: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: "Connected SSID"
      id: ssid
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: "Mac Address"
      id: mac_address
      entity_category: diagnostic
      disabled_by_default: true

light:
  - platform: esp32_rmt_led_strip
    name: All LEDs
    id: ledstrip
    internal: true
    channel_colors: GRB
    pin: GPIO8
    num_leds: 24
    chipset: SK6812
    restore_mode: RESTORE_AND_OFF
    default_transition_length: 0s
    effects:
      - addressable_rainbow:
          name: Addressable Rainbow
    
  # One partition light per LED so Home Assistant can control each LED
  # individually. The strip is wired starting at the bottom row, so the
  # numbering follows the physical layout: LED 01 = R1C1 (strip index 18)
  # ... LED 24 = R4C6 (strip index 5).
  # The main "All LEDs" light above is kept for whole-strip control and
  # effects. Each partition light carries the same 50% brightness cap
  # (color_correct) as the main strip so per-LED control is also limited.
  # Each partition light selects a single LED from the addressable strip via
  # the `segments` list: `id` = source light, `from`/`to` = inclusive indices.
  - platform: partition
    name: "LED 01 R1C1"
    id: led_01
    segments:
      - id: ledstrip
        from: 18
        to: 18
    effects:
      - pulse: {}
      - pulse:
          name: Fast Pulse
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0
          max_brightness: 1
      - pulse:
          name: Slow Pulse
          update_interval: 2s
  - platform: partition
    name: "LED 02 R1C2"
    id: led_02
    segments:
      - id: ledstrip
        from: 19
        to: 19
