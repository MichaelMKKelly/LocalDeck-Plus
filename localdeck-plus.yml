matrix_keypad:
  id: keypad
  keys: ABCDEFGHIJKLMNOPQRSTUVWX
  rows:
    - pin: GPIO21
    - pin: GPIO20
    - pin: GPIO3
    - pin: GPIO7
  columns:
    - pin:
        number: GPIO0
        drive_strength: 5mA
    - pin:
        number: GPIO1
        drive_strength: 5mA
    - pin:
        number: GPIO10
        drive_strength: 5mA
    - pin:
        number: GPIO4
        drive_strength: 5mA
    - pin:
        number: GPIO5
        drive_strength: 5mA
    - pin:
        number: GPIO6
        drive_strength: 5mA

# ---------------------------------------------------------------------------
# One template event per button. Each button exposes four event types
# (single / double / triple / long) fired from the binary_sensor
# on_multi_click handlers below. Home Assistant receives these as event
# entities and can trigger automations on a specific event_type to control
# the matching "LED NN" light. Buttons no longer drive the LEDs directly --
# all LED control happens in Home Assistant.
# ---------------------------------------------------------------------------
event:
  - platform: template
    name: "Button 01 R1C1"
    id: event_01
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 02 R1C2"
    id: event_02
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 03 R1C3"
    id: event_03
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 04 R1C4"
    id: event_04
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 05 R1C5"
    id: event_05
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 06 R1C6"
    id: event_06
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 07 R2C1"
    id: event_07
    device_class: button
    event_types: [single, double, triple, long]
  - platform: template
    name: "Button 08 R2C2"
